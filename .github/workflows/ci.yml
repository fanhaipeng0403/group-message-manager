name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: messaging_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d messaging_platform"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Full-stack reliability smoke
        run: |
          pnpm db:migrate
          pnpm --filter @platform/mock-gateway start > /tmp/relayops-gateway.log 2>&1 &
          GATEWAY_PID=$!
          pnpm --filter @platform/mock-agent start > /tmp/relayops-agent.log 2>&1 &
          AGENT_PID=$!
          pnpm --filter @platform/api start > /tmp/relayops-api.log 2>&1 &
          API_PID=$!
          trap 'kill $GATEWAY_PID $AGENT_PID $API_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/relayops-api.log /tmp/relayops-gateway.log /tmp/relayops-agent.log
              exit 1
            fi
            sleep 1
          done
          pnpm scenario smoke
          pnpm lab:verify
          pnpm sequence:verify
