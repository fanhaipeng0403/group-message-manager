# Build images first: set -a && source deploy/.env && set +a && ./deploy/build-images.sh
services:
  gateway:
    image: group-message-manager-node:${GMM_IMAGE_TAG:-latest}
    command: ["node", "apps/mock-gateway/dist/main.js"]
    environment:
      PORT: "4001"
    networks:
      - gmm
    restart: unless-stopped

  agent:
    image: group-message-manager-node:${GMM_IMAGE_TAG:-latest}
    command: ["node", "apps/mock-agent/dist/main.js"]
    env_file:
      - ${GMM_ENV_FILE:-.env}
    environment:
      PORT: "4002"
    networks:
      - gmm
    restart: unless-stopped

  api:
    image: group-message-manager-node:${GMM_IMAGE_TAG:-latest}
    command: ["sh", "-c", "node apps/api/dist/db/migrate.js && node apps/api/dist/main.js"]
    env_file:
      - ${GMM_ENV_FILE:-.env}
    environment:
      PORT: "3000"
      GATEWAY_URL: http://gateway:4001
      AGENT_URL: http://agent:4002
      DEMO_MODE: "false"
    depends_on:
      - gateway
      - agent
    networks:
      - gmm
    restart: unless-stopped

  web:
    image: group-message-manager-web:${GMM_IMAGE_TAG:-latest}
    ports:
      - "15173:80"
    depends_on:
      - api
    networks:
      - gmm
    restart: unless-stopped

networks:
  gmm:
    driver: bridge
