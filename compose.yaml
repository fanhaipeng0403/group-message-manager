services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: messaging_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d messaging_platform"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - group-message-manager-postgres:/var/lib/postgresql/data

volumes:
  group-message-manager-postgres:
